<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="#0a0a0a"/>
    <!-- media luna: brillo lima muy sutil recortado por la esquina -->
    <ellipse cx="414" cy="148" rx="207" ry="236" fill="#c8f135" opacity="0.24"/>
  </g>
  <!-- T delgada (tamaño original) con extremos redondeados -->
  <rect x="168" y="168" width="184" height="32" rx="16" fill="#c8f135"/>
  <rect x="243" y="168" width="34" height="224" rx="16" fill="#c8f135"/>
  <!-- punto de acento en la posición del original -->
  <circle cx="372" cy="97" r="30" fill="#c8f135" opacity="0.9"/>
</svg>
