<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="#0a0a0a"/>
    <!-- media luna: brillo lima tenue recortado por la esquina -->
    <ellipse cx="414" cy="148" rx="207" ry="236" fill="#c8f135" opacity="0.34"/>
  </g>
  <!-- letra T (tipografía Arial Black) -->
  <text x="256" y="340" font-family="Arial Black, sans-serif" font-weight="900"
    font-size="280" fill="#c8f135" text-anchor="middle">T</text>
  <!-- punto de acento -->
  <circle cx="370" cy="175" r="28" fill="#c8f135" opacity="0.9"/>
</svg>
